
name: Firestore Excel Export & Usage Log

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC (exports old data only)
  workflow_dispatch:
    inputs:
      export_mode:
        description: 'Export mode'
        required: true
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - full

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Excel export and log usage
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          FIREBASE_STORAGE_BUCKET: "sonic-motor-valuers-7762-ca361.appspot.com"
          EXPORT_MODE: ${{ github.event.inputs.export_mode || 'scheduled' }}
        run: node scripts/export-to-excel.js

    
