
name: Firestore Excel Export & Usage Log

on:
  schedule:
    - cron: "0 0 * * *"  # Runs daily at midnight UTC (exports old data only)
  workflow_dispatch:
    inputs:
      export_mode:
        description: 'Export mode'
        required: false
        default: 'scheduled'
        type: choice
        options:
          - scheduled
          - full

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Verify script exists
        run: |
          echo "Checking for export script..."
          ls -la scripts/
          if [ -f "scripts/export-to-excel.js" ]; then
            echo "✓ export-to-excel.js found"
          else
            echo "✗ export-to-excel.js NOT found"
            exit 1
          fi

      - name: Run Excel export and log usage
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
          EXPORT_MODE: ${{ github.event.inputs.export_mode || 'scheduled' }}
        run: node scripts/export-to-excel.js

    
